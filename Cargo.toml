[package]
name = "fsearch"
version = "0.2.0"
edition = "2021"
authors = ["msxyy"]
description = "用 Rust 写的文件内容搜索器，ripgrep 简化版"
license = "MIT"
readme = "README.md"
repository = "https://github.com/msxyy/fsearch"
homepage = "https://github.com/msxyy/fsearch"
keywords = ["search", "grep", "cli", "ripgrep"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/benches"]

[[bin]]
name = "fsearch"
path = "src/main.rs"

[[bench]]
name = "search"
harness = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
ignore = "0.4"
regex = "1"
termcolor = "1"