[package]
name = "fsearch"
version = "0.7.1"
edition = "2021"
authors = ["msxyy"]
description = "用 Rust 写的文件内容搜索器，ripgrep 简化版"
license = "MIT"
readme = "README.md"
repository = "https://github.com/msxyy/fsearch"
homepage = "https://github.com/msxyy/fsearch"
keywords = ["search", "grep", "cli", "ripgrep"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/benches"]

[lib]
name = "fsearch"
path = "src/lib.rs"

[[bin]]
name = "fsearch"
path = "src/main.rs"

[[bench]]
name = "search"
harness = false

[dependencies]
aho-corasick = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
encoding_rs = "0.8"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
termcolor = "1"
toml = "0.8"